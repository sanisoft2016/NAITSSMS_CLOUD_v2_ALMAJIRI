<mat-card appearance="outlined">
  <mat-card-header class="header">
    <mat-card-title>"{{ headerLabel }}" Arm Registration</mat-card-title>
    <span class="spacer"></span>
    <button mat-stroked-button color="primary" type="button" (click)="goBack()">
      <mat-icon>arrow_back</mat-icon>
      Go Back
    </button>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="armForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-grid">
        <mat-form-field appearance="outline">
          <mat-label>Arm Name</mat-label>
          <mat-select formControlName="armName" required>
            @for (opt of armOptions; track opt.value) {
              <mat-option [value]="opt.value">{{ opt.label }}</mat-option>
            }
          </mat-select>
          @if (armForm.get('armName')?.touched && armForm.get('armName')?.hasError('required')) {
            <mat-error>Arm Name is required</mat-error>
          }
        </mat-form-field>
      </div>

      <div class="actions">
        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="armForm.invalid || isSubmitting() || isLoading()"
        >
          @if (isLoading()) {
            <mat-icon>hourglass_empty</mat-icon>
          }
          Create
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
