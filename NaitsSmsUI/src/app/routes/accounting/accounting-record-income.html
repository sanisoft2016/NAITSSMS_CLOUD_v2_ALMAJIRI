<section class="acct-rec-inc">
  <header class="acct-rec-inc__header">
    <h1 class="acct-rec-inc__title">Income Capturing Page</h1>
    @if (dateDisplay()) {
      <p class="acct-rec-inc__subtitle">
        <span class="acct-rec-inc__date">{{ dateDisplay() }}</span>
        <span class="acct-rec-inc__week"> ({{ weekPosition() }} week of the month)</span>
      </p>
    }
  </header>

  @if (error()) {
    <div class="acct-rec-inc__alert acct-rec-inc__alert--error" role="alert">{{ error() }}</div>
  }
  @if (warn()) {
    <div class="acct-rec-inc__alert acct-rec-inc__alert--warn" role="status">{{ warn() }}</div>
  }

  @if (loading()) {
    <div class="acct-rec-inc__loading">
      <mat-spinner diameter="36"></mat-spinner>
    </div>
  } @else {
    <form class="acct-rec-inc__card" (submit)="$event.preventDefault(); save()">
      @if (fieldError()) {
        <div class="acct-rec-inc__alert acct-rec-inc__alert--error" role="alert">
          {{ fieldError() }}
        </div>
      }

      <div class="acct-rec-inc__group">
        <label class="acct-rec-inc__label" for="CapturedDate">Item' Date</label>
        <div class="acct-rec-inc__date-wrap">
          <input
            id="CapturedDate"
            name="CapturedDate"
            type="text"
            class="acct-rec-inc__control acct-rec-inc__date-input"
            placeholder="dd/mm/yyyy"
            autocomplete="off"
            readonly
            [matDatepicker]="capturedDatePicker"
            [ngModel]="capturedDate()"
            (ngModelChange)="onCapturedDateChange($event)"
            (click)="capturedDatePicker.open()"
          />
          <mat-datepicker-toggle
            class="acct-rec-inc__date-toggle"
            [for]="capturedDatePicker"
          ></mat-datepicker-toggle>
          <mat-datepicker
            #capturedDatePicker
            panelClass="acct-rec-inc-datepicker"
            [touchUi]="true"
          ></mat-datepicker>
        </div>
      </div>

      <div class="acct-rec-inc__group">
        <label class="acct-rec-inc__label" for="ItemCategoryId">Income Category</label>
        <select
          id="ItemCategoryId"
          name="ItemCategoryId"
          class="acct-rec-inc__control"
          [ngModel]="itemCategoryId()"
          (ngModelChange)="itemCategoryId.set($event); fieldError.set('')"
        >
          @for (cat of categories(); track cat.value) {
            <option [value]="cat.value">{{ cat.text }}</option>
          }
        </select>
      </div>

      <div class="acct-rec-inc__group acct-rec-inc__group--top">
        <label class="acct-rec-inc__label" for="Details">Details</label>
        <textarea
          id="Details"
          name="Details"
          rows="4"
          maxlength="150"
          class="acct-rec-inc__control acct-rec-inc__textarea"
          [ngModel]="details()"
          (ngModelChange)="details.set($event); fieldError.set('')"
        ></textarea>
      </div>

      <div class="acct-rec-inc__group">
        <label class="acct-rec-inc__label" for="Cost">Cost</label>
        <input
          id="Cost"
          name="Cost"
          type="text"
          inputmode="decimal"
          class="acct-rec-inc__control"
          placeholder="0.00"
          [ngModel]="costDisplay()"
          (ngModelChange)="onCostInput($event)"
        />
      </div>

      <div class="acct-rec-inc__actions">
        <button
          type="submit"
          class="acct-rec-inc__btn acct-rec-inc__btn--primary"
          [disabled]="saving()"
        >
          @if (saving()) {
            <mat-spinner diameter="18"></mat-spinner>
            Saving…
          } @else {
            Save
          }
        </button>
      </div>
    </form>
  }
</section>
