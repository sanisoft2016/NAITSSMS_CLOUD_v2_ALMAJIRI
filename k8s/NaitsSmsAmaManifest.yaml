# =============================================================================
# NAITS SMS AMA – Combined K3s Deployment Manifest (3rd independent instance)
# Basis: NaitsSmsHillsManifest.yaml — same Docker image, separate PostgreSQL + storage
# Target: same K3s cluster as NAITS ASMS and Hills; resources must not collide
# Includes: PostgreSQL 18 (StatefulSet) + naitssmsama-api (Deployment)
#            + Aspire Dashboard (standalone OTLP UI)
#
# Data was imported from the local Aspire database.
# On-cluster: postgres-service-naitssmsama:5432. DB name / user / password
# live only in the gitignored secrets overlay. Restore the dump after first apply (see below).
# =============================================================================
# Apply with (secrets first — see k8s/secrets/README.md):
#   kubectl apply -f k8s/secrets/NaitsSmsAma.secrets.local.yaml
#   kubectl apply -f k8s/NaitsSmsAmaManifest.yaml
#
# All durable files live under ONE host root (SEPARATE from naittsasms and naitssmshills):
#   /sani/tmp/naitssmsama/
#     ├── postgres/                 # PostgreSQL data (PGDATA parent)
#     ├── wwwroot/                  # API static uploads (/app/wwwroot)
#     │     ├── Passport/
#     │     ├── Signatures/
#     │     ├── profile-avatars/
#     │     └── school-logos/
#     └── database-backups/         # CronJob pg_dump (.dump); unique-size retention
#
# Prerequisites on the VPS node:
#   mkdir -p /sani/tmp/naitssmsama/postgres/data \
#            /sani/tmp/naitssmsama/wwwroot/Passport \
#            /sani/tmp/naitssmsama/wwwroot/Signatures \
#            /sani/tmp/naitssmsama/wwwroot/profile-avatars \
#            /sani/tmp/naitssmsama/wwwroot/school-logos \
#            /sani/tmp/naitssmsama/database-backups
#   chown -R 999:999 /sani/tmp/naitssmsama/postgres /sani/tmp/naitssmsama/database-backups
#   chown -R 1000:1000 /sani/tmp/naitssmsama/wwwroot
#
# In-cluster API connection (Aspire name keys "NaitsASMSDb" and "NaitsAmaDb"):
#   Host=postgres-service-naitssmsama;Port=5432;Username=<db-user>;Password=<db-password>;Database=<db-name>
#
# External DBA / tools: no public port. Open an SSH tunnel (keep it running),
# then connect to localhost:15432:
#   ssh -L 15432:127.0.0.1:15432 root@<VPS-IP> kubectl port-forward --address 127.0.0.1 svc/postgres-service-naitssmsama 15432:5432
#   Host=localhost;Port=15432;Username=<db-user>;Password=<db-password>;Database=<db-name>
#
# Aspire Dashboard UI: no public port (it has no login). Open an SSH tunnel, then browse
# http://localhost:28888:
#   ssh -L 28888:127.0.0.1:28888 root@<VPS-IP> kubectl port-forward --address 127.0.0.1 svc/aspire-dashboard-naitssmsama 28888:18888
#   API OTEL (in-cluster): http://aspire-dashboard-naitssmsama:18889 (gRPC)
#
# API HTTP NodePort 30094 (ASMS uses 30092; Hills uses 30093). Same image: sanibesiru/naitsasms-api:latest
#
# ---------------------------------------------------------------------------
# ONE-TIME DATA REPLICATION (local Aspire <db-name> → cluster Postgres)
# Produce a dump locally, then:
#   pg_dump -h localhost -p 5434 -U <local-db-user> -d <db-name> -F c -f .tmp-db-migrate/<db-name>.dump
#
# On the VPS after kubectl apply and postgres-naitssmsama-0 is Ready:
#   scp .tmp-db-migrate/<db-name>.dump root@<VPS-IP>:/tmp/
#   kubectl cp /tmp/<db-name>.dump default/postgres-naitssmsama-0:/tmp/<db-name>.dump
#   kubectl exec -i postgres-naitssmsama-0 -- \
#     pg_restore -U <db-user> -d <db-name> --no-owner --no-acl --clean --if-exists \
#     /tmp/<db-name>.dump
#   kubectl exec postgres-naitssmsama-0 -- rm -f /tmp/<db-name>.dump
#   rm -f /tmp/<db-name>.dump
# Or restore from a workstation through the SSH tunnel above (localhost:15432):
#   docker run --rm -e PGPASSWORD='<set-in-k8s-secrets-overlay>' \
#     -v "$PWD/.tmp-db-migrate:/out" postgres:18 \
#     pg_restore -h host.docker.internal -p 15432 -U <db-user> -d <db-name> \
#     --no-owner --no-acl --clean --if-exists /out/<db-name>.dump
# ---------------------------------------------------------------------------
# =============================================================================

# ---------------------------------------------------------------------------
# SECTION 1 – PostgreSQL ConfigMap
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config-naitssmsama
  namespace: default
  labels:
    app: postgres-naitssmsama
    tier: database
    instance: naitssmsama
data:
  PGDATA: /var/lib/postgresql/data

---
# REMOVED FROM GIT (GitGuardian): Secret/postgres-secret-naitssmsama
# (POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD). On an empty PGDATA the official
# postgres image creates POSTGRES_DB owned by POSTGRES_USER, so no init script is needed.
# Apply from gitignored overlay: k8s/secrets/NaitsSmsAma.secrets.local.yaml
---
# ---------------------------------------------------------------------------
# SECTION 3a – PostgreSQL ClusterIP Service (in-cluster, used by the API)
# API connects via: Host=postgres-service-naitssmsama;Port=5432
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: postgres-service-naitssmsama
  namespace: default
  labels:
    app: postgres-naitssmsama
    tier: database
    instance: naitssmsama
spec:
  type: ClusterIP
  selector:
    app: postgres-naitssmsama
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

---
# ---------------------------------------------------------------------------
# SECTION 4a – PostgreSQL data under /sani/tmp/naitssmsama/postgres
# ---------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolume
metadata:
  name: naitssmsama-postgres-volume
  namespace: default
  labels:
    app: postgres-naitssmsama
    tier: database
    instance: naitssmsama
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual-naitssmsama-postgres
  hostPath:
    path: /sani/tmp/naitssmsama/postgres
    type: DirectoryOrCreate

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: naitssmsama-postgres-volume-claim
  namespace: default
  labels:
    app: postgres-naitssmsama
    tier: database
    instance: naitssmsama
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual-naitssmsama-postgres
  volumeName: naitssmsama-postgres-volume
  resources:
    requests:
      storage: 2Gi

---
# ---------------------------------------------------------------------------
# SECTION 4b – PostgreSQL StatefulSet
# postgres:18 matches the Hills instance for dump/restore tooling compatibility.
# Resources sized for Hostinger KVM 2 co-hosted with ASMS + Hills + CustReward.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-naitssmsama
  namespace: default
  labels:
    app: postgres-naitssmsama
    tier: database
    instance: naitssmsama
spec:
  serviceName: postgres-service-naitssmsama
  replicas: 1
  selector:
    matchLabels:
      app: postgres-naitssmsama
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: postgres-naitssmsama
        tier: database
        instance: naitssmsama
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: init-perms
          image: alpine:3.20
          securityContext:
            runAsUser: 0
          command: ["/bin/sh", "-c"]
          args:
            - >
              find /var/lib/postgresql -maxdepth 1 -name "*.sql" -delete 2>/dev/null;
              mkdir -p /var/lib/postgresql/data &&
              chown 999:999 /var/lib/postgresql &&
              chown -R 999:999 /var/lib/postgresql/data &&
              chmod 700 /var/lib/postgresql &&
              chmod 700 /var/lib/postgresql/data
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
      containers:
        - name: postgres
          image: postgres:18
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: postgres-config-naitssmsama
            - secretRef:
                name: postgres-secret-naitssmsama
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data
          ports:
            - containerPort: 5432
              name: postgres
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: naitssmsama-postgres-volume-claim

---
# ---------------------------------------------------------------------------
# SECTION 5 – API ConfigMap
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: naitssmsama-api-env
  namespace: default
  labels:
    app: naitssmsama-api
    tier: api
    instance: naitssmsama
data:
  ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
  ASPNETCORE_URLS: "http://+:8080"
  ASPNETCORE_ENVIRONMENT: "Production"
  HTTP_PORTS: "8080"
  MAP_ASPIRE_HEALTH_ENDPOINTS: "true"
  DOTNET_RUNNING_IN_CONTAINER: "true"
  OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES: "true"
  OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES: "true"
  OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
  OTEL_SERVICE_NAME: "naitssmsama-api"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard-naitssmsama:18889"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  TwoFactor__Issuer: "NAITS-SMS-AMA"
  # Demo__AllowAlmajiriSeed: "true"
  NAITS_UNIQUE_SYSTEM_ID: "ourschoolonline-vps-01-smsama"

---
# REMOVED FROM GIT (GitGuardian): Secret/naitssmsama-api-secrets
# Apply from gitignored overlay: k8s/secrets/NaitsSmsAma.secrets.local.yaml
---
# ---------------------------------------------------------------------------
# SECTION 7 – Uploads / wwwroot PersistentVolume & Claim
# Host path: /sani/tmp/naitssmsama/wwwroot  →  container: /app/wwwroot
# ---------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolume
metadata:
  name: naitssmsama-wwwroot-volume
  namespace: default
  labels:
    app: naitssmsama-api
    tier: api
    instance: naitssmsama
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual-naitssmsama-wwwroot
  hostPath:
    path: /sani/tmp/naitssmsama/wwwroot
    type: DirectoryOrCreate

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: naitssmsama-wwwroot-volume-claim
  namespace: default
  labels:
    app: naitssmsama-api
    tier: api
    instance: naitssmsama
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual-naitssmsama-wwwroot
  volumeName: naitssmsama-wwwroot-volume
  resources:
    requests:
      storage: 2Gi

---
# ---------------------------------------------------------------------------
# SECTION 8 – API Deployment
# Same image as ASMS/Hills; DB isolation via connection-string secrets above.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: naitssmsama-api
  namespace: default
  labels:
    app: naitssmsama-api
    tier: api
    instance: naitssmsama
spec:
  replicas: 1
  minReadySeconds: 30
  selector:
    matchLabels:
      app: naitssmsama-api
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: naitssmsama-api
        tier: api
        instance: naitssmsama
    spec:
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: dockerhub-sanibesiru
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres-service-naitssmsama 5432; do
                echo "Waiting for PostgreSQL..."; sleep 3;
              done
              echo "PostgreSQL is ready."
          resources:
            requests:
              cpu: "20m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
        - name: ensure-upload-dirs
          image: busybox:1.36
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          command:
            - sh
            - -c
            - |
              mkdir -p \
                /wwwroot/Passport \
                /wwwroot/Signatures \
                /wwwroot/profile-avatars \
                /wwwroot/school-logos
              chown -R 1000:1000 /wwwroot
              chmod -R u+rwX,g+rwX /wwwroot
              echo "Upload dirs ready under /wwwroot:"
              ls -la /wwwroot /wwwroot/Passport /wwwroot/Signatures /wwwroot/profile-avatars /wwwroot/school-logos
          volumeMounts:
            - name: wwwroot-volume
              mountPath: /wwwroot
          resources:
            requests:
              cpu: "20m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
      containers:
        - name: naitssmsama-api
          image: sanibesiru/naitsasms-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: naitssmsama-api-env
            - secretRef:
                name: naitssmsama-api-secrets
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "1500m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: wwwroot-volume
              mountPath: /app/wwwroot
      volumes:
        - name: wwwroot-volume
          persistentVolumeClaim:
            claimName: naitssmsama-wwwroot-volume-claim

---
# ---------------------------------------------------------------------------
# SECTION 9 – API Service (NodePort)
# HTTP on host port 30094 (ASMS uses 30092; Hills uses 30093; CustReward uses 30081).
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: naitssmsama-api
  namespace: default
  labels:
    app: naitssmsama-api
    tier: api
    instance: naitssmsama
spec:
  type: NodePort
  selector:
    app: naitssmsama-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30094
      protocol: TCP

---
# ---------------------------------------------------------------------------
# SECTION 9b – Aspire Dashboard (standalone)
# Browser UI: SSH tunnel only (see header); no public NodePort.
# In-cluster OTLP/gRPC for the API: aspire-dashboard-naitssmsama:18889
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aspire-dashboard-naitssmsama
  namespace: default
  labels:
    app: aspire-dashboard-naitssmsama
    tier: observability
    instance: naitssmsama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aspire-dashboard-naitssmsama
  template:
    metadata:
      labels:
        app: aspire-dashboard-naitssmsama
        tier: observability
        instance: naitssmsama
    spec:
      containers:
        - name: aspire-dashboard
          image: mcr.microsoft.com/dotnet/aspire-dashboard:9.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 18888
              protocol: TCP
            - name: otlp-grpc
              containerPort: 18889
              protocol: TCP
            - name: otlp-http
              containerPort: 18890
              protocol: TCP
          env:
            - name: ASPNETCORE_URLS
              value: "http://0.0.0.0:18888"
            - name: DOTNET_DASHBOARD_OTLP_ENDPOINT_URL
              value: "http://0.0.0.0:18889"
            - name: DOTNET_DASHBOARD_OTLP_HTTP_ENDPOINT_URL
              value: "http://0.0.0.0:18890"
            - name: ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS
              value: "true"
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 18888
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 18888
            initialDelaySeconds: 15
            periodSeconds: 20

---
# ---------------------------------------------------------------------------
# SECTION 9c – Aspire Dashboard ClusterIP (UI + OTLP for in-cluster apps)
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: aspire-dashboard-naitssmsama
  namespace: default
  labels:
    app: aspire-dashboard-naitssmsama
    tier: observability
    instance: naitssmsama
spec:
  type: ClusterIP
  selector:
    app: aspire-dashboard-naitssmsama
  ports:
    - name: http
      port: 18888
      targetPort: 18888
      protocol: TCP
    - name: otlp-grpc
      port: 18889
      targetPort: 18889
      protocol: TCP
    - name: otlp-http
      port: 18890
      targetPort: 18890
      protocol: TCP

---
# ---------------------------------------------------------------------------
# SECTION 10 – Database Backup CronJob
# Daily 03:00 UTC → /sani/tmp/naitssmsama/database-backups/
# (ASMS 02:00, Hills 02:30 — staggered on the shared VPS)
# Dump file prefix: <db-name>-yyyyMMdd-HHmmss.dump
#
# Manual one-off:
#   kubectl create job --from=cronjob/postgres-backup-naitssmsama postgres-backup-naitssmsama-manual -n default
# ---------------------------------------------------------------------------
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup-naitssmsama
  namespace: default
  labels:
    app: db-backup-naitssmsama
    instance: naitssmsama
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
          initContainers:
            - name: wait-for-postgres
              image: busybox:1.36
              command:
                - sh
                - -c
                - |
                  until nc -z postgres-service-naitssmsama 5432; do
                    echo "Waiting for PostgreSQL..."; sleep 3;
                  done
                  echo "PostgreSQL is ready."
              resources:
                requests:
                  cpu: "20m"
                  memory: "16Mi"
                limits:
                  cpu: "50m"
                  memory: "32Mi"
          containers:
            - name: pg-dump
              image: postgres:18
              imagePullPolicy: IfNotPresent
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret-naitssmsama
                      key: POSTGRES_PASSWORD
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret-naitssmsama
                      key: POSTGRES_USER
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret-naitssmsama
                      key: POSTGRES_DB
              command:
                - sh
                - -c
                - |
                  set -eu
                  BACKUP_DIR=/backup
                  DB="$POSTGRES_DB"
                  STAMP=$(date +%Y%m%d-%H%M%S)
                  OUT="${BACKUP_DIR}/${DB}-${STAMP}.dump"
                  STATUS="${BACKUP_DIR}/.last-backup-status.txt"

                  write_status() {
                    printf 'Time: %s\nStatus: %s\nDetail: %s\n' "$(date '+%Y-%m-%d %H:%M:%S')" "$1" "$2" > "$STATUS"
                  }

                  write_status "started" "Running pg_dump -F c to ${OUT}"
                  if ! pg_dump -w -h postgres-service-naitssmsama -U "$POSTGRES_USER" -d "$DB" -F c -f "$OUT"; then
                    rm -f "$OUT"
                    write_status "failed" "pg_dump exited with an error"
                    exit 1
                  fi

                  if [ ! -s "$OUT" ]; then
                    rm -f "$OUT"
                    write_status "failed" "pg_dump finished but output file is missing or empty"
                    exit 1
                  fi

                  NEW_SIZE=$(stat -c%s "$OUT")

                  PREV=""
                  for f in $(ls -1t "${BACKUP_DIR}/${DB}-"*.dump 2>/dev/null || true); do
                    [ "$f" = "$OUT" ] && continue
                    PREV="$f"
                    break
                  done

                  if [ -n "$PREV" ] && [ -f "$PREV" ]; then
                    PREV_SIZE=$(stat -c%s "$PREV")
                    if [ "$PREV_SIZE" = "$NEW_SIZE" ]; then
                      rm -f "$PREV"
                      echo "Deleted previous backup ${PREV} because it matches the new backup size (${NEW_SIZE} bytes)."
                    fi
                  fi

                  write_status "success" "Created ${OUT} (${NEW_SIZE} bytes)."
                  echo "Backup written: ${OUT} (${NEW_SIZE} bytes)"
              volumeMounts:
                - name: database-backups
                  mountPath: /backup
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "300m"
                  memory: "512Mi"
          volumes:
            - name: database-backups
              hostPath:
                path: /sani/tmp/naitssmsama/database-backups
                type: DirectoryOrCreate
