# Example only — copy to NaitsAsms.secrets.local.yaml and fill real values.
#   cp k8s/secrets/NaitsAsms.secrets.example.yaml k8s/secrets/NaitsAsms.secrets.local.yaml
# *.local.yaml is gitignored. Apply before the main manifest:
#   kubectl apply -f k8s/secrets/NaitsAsms.secrets.local.yaml
#   kubectl apply -f k8s/NaitsAsmsManifest.yaml
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret-naitsasms
  namespace: default
  labels:
    app: postgres-naitsasms
    tier: database
type: Opaque
stringData:
  POSTGRES_DB: "REPLACE_ME_DB_NAME"
  POSTGRES_USER: "REPLACE_ME_DB_USER"
  POSTGRES_PASSWORD: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: naitsasms-api-secrets
  namespace: default
  labels:
    app: naitsasms-api
    tier: api
type: Opaque
stringData:
  ConnectionStrings__NaitsASMSDb: "Host=postgres-service-naitsasms;Port=5432;Username=REPLACE_ME_DB_USER;Password=REPLACE_ME;Database=REPLACE_ME_DB_NAME"
  ConnectionStrings__NaitsAmaDb: "Host=postgres-service-naitsasms;Port=5432;Username=REPLACE_ME_DB_USER;Password=REPLACE_ME;Database=REPLACE_ME_DB_NAME"
  JWT__Secret: "REPLACE_ME_WITH_LONG_RANDOM_SECRET"
  EmailCredentials__From: "REPLACE_ME_SENDING_MAILBOX"
  EmailCredentials__Password: "REPLACE_ME"
