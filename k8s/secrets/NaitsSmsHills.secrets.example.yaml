# Example only — copy to *.secrets.local.yaml, replace REPLACE_ME, never commit the local file.
#   cp k8s/secrets/NaitsSmsHills.secrets.example.yaml k8s/secrets/NaitsSmsHills.secrets.local.yaml
#   kubectl apply -f k8s/secrets/NaitsSmsHills.secrets.local.yaml
#   kubectl apply -f k8s/NaitsSmsHillsManifest.yaml
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret-naitssmshills
  namespace: default
  labels:
    app: postgres-naitssmshills
    tier: database
    instance: naitssmshills
type: Opaque
stringData:
  POSTGRES_DB: "REPLACE_ME_DB_NAME"
  POSTGRES_USER: "REPLACE_ME_DB_USER"
  POSTGRES_PASSWORD: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: naitssmshills-api-secrets
  namespace: default
  labels:
    app: naitssmshills-api
    tier: api
    instance: naitssmshills
type: Opaque
stringData:
  ConnectionStrings__NaitsASMSDb: "Host=postgres-service-naitssmshills;Port=5432;Username=REPLACE_ME_DB_USER;Password=REPLACE_ME;Database=REPLACE_ME_DB_NAME"
  ConnectionStrings__NaitsAmaDb: "Host=postgres-service-naitssmshills;Port=5432;Username=REPLACE_ME_DB_USER;Password=REPLACE_ME;Database=REPLACE_ME_DB_NAME"
  JWT__Secret: "REPLACE_ME_WITH_LONG_RANDOM_SECRET"
  EmailCredentials__From: "REPLACE_ME_SENDING_MAILBOX"
  EmailCredentials__Password: "REPLACE_ME"
